<!doctype html>
<html lang="de"><meta charset="UTF-8"><title>Neue Gegnermodelle</title>
<style>body{margin:0;background:#111923;color:#e2e8f0;font:16px system-ui;padding:32px}h1{font-size:24px}canvas{max-width:100%;border:1px solid #415064;border-radius:12px}</style>
<h1>Fünf neue Gegnermodelle</h1><p>Delta-Jäger · Orbital-Sonde · Läufer · Artillerie · Fregatte</p><canvas width="900" height="280"></canvas><p id="status">Modelle werden geladen …</p>
<script type="module">
import { BIOMES } from '/src/biomes.ts';
import { drawExtendedBiomeEnemy } from '/src/rendering/biome-enemies.ts';
const ctx = document.querySelector('canvas').getContext('2d');
const types = ['delta','orbiter','walker','battery','frigate'];
let count = 0;
for (const [index, visual] of types.entries()) {
  const enemy = BIOMES.flatMap(b => b.enemies.slice(3)).find(e => e.visual === visual);
  const x = index * 180 + 90;
  ctx.save(); ctx.translate(x, 125); ctx.rotate(Math.PI); ctx.scale(1.8, 1.8);
  const hull = ctx.createLinearGradient(0, -enemy.height/2, 0, enemy.height/2);
  for (const [stop,color] of [[0,enemy.accent],[.18,enemy.color],[.48,'#111820'],[.72,enemy.color],[1,'#111820']]) hull.addColorStop(stop,color);
  if (drawExtendedBiomeEnemy(ctx, visual, enemy.color, enemy.accent, hull, .72)) count++;
  ctx.restore(); ctx.fillStyle = '#e2e8f0'; ctx.textAlign = 'center'; ctx.font='13px system-ui';
  ctx.fillText(enemy.name,x,210); ctx.fillStyle='#93a4bc'; ctx.fillText(`${enemy.width} × ${enemy.height}`,x,235);
}
document.querySelector('#status').textContent = `${count}/5 Modelle gezeichnet · ${BIOMES.flatMap(b=>b.enemies).length} Gegner in 10 Hintergründen`;
</script></html>
